services:
  db:
    image: ghcr.io/baosystems/postgis:15-3.3
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-township}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-township_db}
    ports:
      # Bind to loopback only — the DB must never be reachable from outside the host.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-township}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    ulimits:
      nproc: 1024
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis holds two very different things here, and the old configuration
    # treated them the same.
    #
    # The caches (public request lists, advanced statistics) are disposable --
    # losing one costs a slow page. The Celery queue is not: it holds every
    # confirmation email, AI triage and govtech push that has been accepted but
    # not yet run.
    #
    # `allkeys-lru` lets Redis evict *any* key under memory pressure, queue
    # entries included, with nothing raised and nothing logged. A busy morning
    # could drop a resident's confirmation email and no part of the system
    # would know. `noeviction` makes a full Redis refuse writes instead, which
    # the application already handles: cache writes are wrapped, and enqueue()
    # logs the failure and lets the record stand. Loud beats silent.
    #
    # And with no volume, everything vanished on restart -- including the
    # restart the domain setup now asks an administrator to perform. AOF with a
    # one-second fsync bounds that to the last second of accepted work.
    command: >
      redis-server
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      # Bind to loopback only — Redis has no auth and must not be internet-reachable.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    restart: unless-stopped
    # No --reload. This file is what the live deployment runs, and ./backend is
    # bind-mounted, so --reload made the API restart on any file write: every
    # deploy, and every stray editor save. Each restart drops in-flight requests
    # and starts with a cold secret cache, which is most of why this instance had
    # 13,433 Secret Manager reads. Backend code changes now need an explicit
    # `docker compose restart backend`, which is what a deploy does anyway.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./backend:/app
      - .:/project
      - uploads_data:/project/uploads
      # Pre-migration pg_dumps land here. Local-only and pruned to the newest
      # three: each is an unencrypted copy of the whole resident database.
      - migration_backups:/backups
      # Where the custom-domain site snippet is written when an administrator
      # sets the town's domain. Caddy imports this same directory, so writing a
      # file here plus a reload is the whole mechanism -- the API no longer
      # regenerates the Caddyfile, which used to drop the security headers and
      # every provisioned tenancy along with it.
      - ${TENANT_CADDY_PATH:-/home/ubuntu/centralizedhosting/tenants/_caddy}:/etc/caddy/tenants
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-township}:${DB_PASSWORD:?Set DB_PASSWORD}@db/${DB_NAME:-township_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set a strong unique SECRET_KEY in .env (e.g. openssl rand -hex 32) — it signs JWTs and derives the PII encryption key}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-500/minute}
      DOMAIN: ${DOMAIN:-localhost}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-us-central1}
      # Accela sign-in: one developer-portal app serves every deployment, so the
      # client credentials are set here rather than typed in by a clerk. Unset
      # is fine — the wizard then offers the username/password fallback.
      ACCELA_CLIENT_ID: ${ACCELA_CLIENT_ID:-}
      ACCELA_CLIENT_SECRET: ${ACCELA_CLIENT_SECRET:-}
      ACCELA_REDIRECT_URI: ${ACCELA_REDIRECT_URI:-}
      # Operator-hosted deployment registration form (e.g. a Microsoft Form).
      # When set, the admin console offers it instead of the built-in contact
      # form, filling in any {organization}/{deployment_url}/... tokens the URL
      # contains. Empty is fine — the in-app form is the fallback. See
      # .env.example for the token list.
      CONTACT_FORM_URL: ${CONTACT_FORM_URL:-}
      CONTACT_FORM_EMBED: ${CONTACT_FORM_EMBED:-true}
      PROJECT_ROOT: /project
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Bind to loopback only — public traffic reaches the backend via Caddy.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  worker:
    build: ./backend
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --beat --loglevel=info
    volumes:
      - ./backend:/app
      # The worker shares the entrypoint, so it can be the container that wins
      # the advisory lock and performs the migration. It needs somewhere to put
      # the pre-migration dump, or it would refuse to start.
      - migration_backups:/backups
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-township}:${DB_PASSWORD:?Set DB_PASSWORD}@db/${DB_NAME:-township_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:?Set a strong unique SECRET_KEY in .env (e.g. openssl rand -hex 32) — it signs JWTs and derives the PII encryption key}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_VERTEX_PROJECT: ${GOOGLE_VERTEX_PROJECT:-}
      GOOGLE_VERTEX_LOCATION: ${GOOGLE_VERTEX_LOCATION:-us-central1}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      # The worker runs the nightly Accela syncs, so it needs the same app
      # credentials to exchange refresh tokens.
      ACCELA_CLIENT_ID: ${ACCELA_CLIENT_ID:-}
      ACCELA_CLIENT_SECRET: ${ACCELA_CLIENT_SECRET:-}
      ACCELA_REDIRECT_URI: ${ACCELA_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Shell form, so $$HOSTNAME expands inside the container. In exec form it
      # is passed through literally and the ping never finds a node to answer.
      test: [ "CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      - VITE_API_URL=/api
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${TENANT_CADDY_PATH:-/home/ubuntu/centralizedhosting/tenants/_caddy}:/etc/caddy/tenants
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          memory: 32M
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  # The Celery queue. Without this, a restart drops every accepted-but-not-yet-run
  # email, AI analysis and integration push.
  redis_data:
  migration_backups:
  caddy_data:
  caddy_config:
  uploads_data:
